<style>
:root{--paper:#FBF8F3;--green:#1F4D45;--deep:#0C221F;--gold:#B8924A;--gold2:#D4B57A;--ink:#1E2624;
--serif:"Didot","Bodoni 72","Playfair Display","Cormorant Garamond","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
--serif2:"Palatino Linotype",Palatino,"Book Antiqua","Iowan Old Style",Georgia,serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--deep);color:#fff;font:17px/1.6 var(--sans);overflow:hidden}
.bg{position:fixed;inset:0;background:#244 url(img/hero.jpg) center 60%/cover no-repeat;transform:scale(1.05);animation:kb 24s ease-out forwards}
@keyframes kb{to{transform:scale(1)}}
.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,20,18,.55) 0%,rgba(6,20,18,.25) 40%,rgba(6,20,18,.82) 100%)}
.page{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.mark{width:58px;height:58px;fill:none;stroke:var(--gold2);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;margin:0 auto 18px}
.eyebrow{font:600 .74rem/1.4 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:#F3E3C0;margin:0 0 14px;text-shadow:0 1px 10px rgba(0,0,0,.6)}
h1{font:400 clamp(2.6rem,7.5vw,5.6rem)/1.05 var(--serif);letter-spacing:.01em;margin:0;text-shadow:0 2px 30px rgba(0,0,0,.3)}
.sub{font:clamp(1.05rem,1.7vw,1.3rem)/1.6 var(--serif2);max-width:560px;margin:18px auto 34px;text-shadow:0 1px 12px rgba(0,0,0,.4)}
form{width:min(440px,100%);margin:0 auto;padding:28px 28px 22px;background:rgba(251,248,243,.1);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
label{display:block;font:600 .72rem/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);margin-bottom:12px;text-align:left}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;padding:.95rem 1rem;font:400 1rem var(--sans);color:var(--ink);background:var(--paper);border:1px solid transparent;outline:none;border-radius:0}
input:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(212,181,122,.35)}
button{padding:.95rem 1.3rem;background:var(--green);color:#fff;border:1px solid var(--green);font:600 .8rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:.25s}
button:hover{background:#fff;color:var(--deep);border-color:#fff}
button[disabled]{opacity:.6;cursor:wait}
.msg{min-height:1.4em;margin:12px 0 0;font-size:.9rem;text-align:left;color:#F3E3C0}
.msg.err{color:#FFD3C4}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.foot{position:fixed;left:0;right:0;bottom:18px;z-index:2;text-align:center;font:500 .72rem/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.7)}
@media (max-width:480px){.row{flex-direction:column}button{width:100%}form{padding:22px 18px 16px}}
</style>
</head>

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function ub64(a){var s="",u=new Uint8Array(a);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function norm(p){return p.replace(/\s+/g,"").toLowerCase()}
async function derive(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm(pw)),"PBKDF2",false,["deriveBits"]);

async function open_(raw){
